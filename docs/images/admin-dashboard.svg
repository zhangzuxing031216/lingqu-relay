<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Relay admin dashboard mockup">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.02"/>
    </linearGradient>
    <style>
      .bg { fill: #0b1220; }
      .side { fill: #0f172a; }
      .panel { fill: #111a2e; stroke: #1e293b; stroke-width: 1; }
      .panel2 { fill: #0d1526; stroke: #1e293b; stroke-width: 1; }
      .title { fill: #f8fafc; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 18px; font-weight: 700; }
      .h2 { fill: #e2e8f0; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 12px; font-weight: 700; }
      .t { fill: #cbd5e1; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 11px; }
      .s { fill: #94a3b8; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 10px; }
      .tiny { fill: #64748b; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 9px; }
      .num { fill: #f8fafc; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 24px; font-weight: 700; }
      .up { fill: #34d399; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 10px; }
      .grid { stroke: #1e293b; stroke-width: 1; }
      .accent { fill: #22d3ee; }
      .green { fill: #34d399; }
      .amber { fill: #fbbf24; }
      .red { fill: #f87171; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760"/>

  <!-- sidebar -->
  <rect class="side" width="210" height="760"/>
  <circle cx="34" cy="34" r="10" fill="#22d3ee"/>
  <text x="52" y="40" class="title" font-size="16">灵渠 AI</text>
  <text x="28" y="70" class="tiny">RELAY CONSOLE · DEMO</text>

  <rect x="16" y="96" width="178" height="36" rx="7" fill="#164e63"/>
  <text x="34" y="119" class="t" fill="#ecfeff">▦  运营概览</text>
  <text x="34" y="160" class="t">◈  渠道管理</text>
  <text x="34" y="196" class="t">◎  模型与定价</text>
  <text x="34" y="232" class="t">♙  用户与令牌</text>
  <text x="34" y="268" class="t">▤  请求日志</text>
  <text x="34" y="304" class="t">⚙  系统设置</text>

  <line x1="16" y1="336" x2="194" y2="336" class="grid"/>
  <text x="34" y="362" class="tiny">快捷动作</text>
  <rect x="16" y="376" width="178" height="30" rx="6" class="panel"/>
  <text x="30" y="396" class="s">+ 新建渠道</text>
  <rect x="16" y="414" width="178" height="30" rx="6" class="panel"/>
  <text x="30" y="434" class="s">+ 新建令牌</text>

  <text x="24" y="700" class="tiny">v0.0.0 · 示例数据</text>
  <text x="24" y="718" class="tiny">localhost:3000</text>

  <!-- topbar -->
  <rect x="210" y="0" width="990" height="64" fill="#0f172a"/>
  <text x="238" y="30" class="h2">运营概览</text>
  <text x="238" y="48" class="tiny">最近 24 小时 · 示例数据</text>
  <rect x="980" y="16" width="120" height="30" rx="6" class="panel"/>
  <text x="996" y="36" class="s">2026-11-06</text>
  <circle cx="1140" cy="32" r="13" fill="#1e293b"/>
  <text x="1135" y="36" class="s">A</text>

  <!-- stats -->
  <rect x="230" y="84" width="220" height="96" class="panel" rx="9"/>
  <text x="248" y="108" class="s">今日请求</text>
  <text x="248" y="142" class="num">12,480</text>
  <text x="248" y="164" class="up">▲ 18.2% 较昨日</text>

  <rect x="470" y="84" width="220" height="96" class="panel" rx="9"/>
  <text x="488" y="108" class="s">Token 消耗</text>
  <text x="488" y="142" class="num">8.42M</text>
  <text x="488" y="164" class="up">▲ 9.7% 较昨日</text>

  <rect x="710" y="84" width="220" height="96" class="panel" rx="9"/>
  <text x="728" y="108" class="s">今日收入（示例）</text>
  <text x="728" y="142" class="num">¥326.50</text>
  <text x="728" y="164" class="up">▲ 12.4% 较昨日</text>

  <rect x="950" y="84" width="220" height="96" class="panel" rx="9"/>
  <text x="968" y="108" class="s">请求成功率</text>
  <text x="968" y="142" class="num">99.2%</text>
  <text x="968" y="164" class="up">健康 · 4 个渠道在线</text>

  <!-- chart -->
  <rect x="230" y="204" width="610" height="270" class="panel" rx="10"/>
  <text x="250" y="232" class="h2">请求趋势</text>
  <text x="250" y="250" class="tiny">每 2 小时聚合 · 单位：次</text>
  <text x="760" y="232" class="tiny" fill="#22d3ee">● 请求</text>
  <text x="820" y="232" class="tiny" fill="#a78bfa">● 失败</text>

  <!-- grid -->
  <line x1="270" y1="282" x2="810" y2="282" class="grid"/>
  <line x1="270" y1="322" x2="810" y2="322" class="grid"/>
  <line x1="270" y1="362" x2="810" y2="362" class="grid"/>
  <line x1="270" y1="402" x2="810" y2="402" class="grid"/>
  <text x="250" y="286" class="tiny">1.2k</text>
  <text x="250" y="326" class="tiny">800</text>
  <text x="250" y="366" class="tiny">400</text>
  <text x="250" y="406" class="tiny">0</text>

  <!-- area + line -->
  <path d="M 282 388 L 330 370 L 378 378 L 426 346 L 474 356 L 522 318 L 570 332 L 618 296 L 666 306 L 714 276 L 762 288 L 810 266 L 810 412 L 282 412 Z" fill="url(#area)"/>
  <path d="M 282 388 L 330 370 L 378 378 L 426 346 L 474 356 L 522 318 L 570 332 L 618 296 L 666 306 L 714 276 L 762 288 L 810 266" fill="none" stroke="#22d3ee" stroke-width="2.4"/>
  <path d="M 282 404 L 330 402 L 378 404 L 426 398 L 474 400 L 522 396 L 570 398 L 618 392 L 666 396 L 714 390 L 762 394 L 810 388" fill="none" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="4 3"/>

  <text x="282" y="438" class="tiny">00:00</text>
  <text x="442" y="438" class="tiny">08:00</text>
  <text x="602" y="438" class="tiny">16:00</text>
  <text x="762" y="438" class="tiny">24:00</text>

  <!-- channel health -->
  <rect x="860" y="204" width="310" height="270" class="panel" rx="10"/>
  <text x="880" y="232" class="h2">渠道健康</text>
  <text x="880" y="250" class="tiny">探测间隔 5 分钟 · 仅示例</text>

  <rect x="880" y="268" width="270" height="52" rx="7" class="panel2"/>
  <circle cx="896" cy="286" r="4" class="green"/>
  <text x="908" y="290" class="t">渠道 A · 主力</text>
  <text x="908" y="307" class="tiny">延迟 380ms · 成功率 99.6%</text>
  <text x="1128" y="290" class="tiny" fill="#34d399">在线</text>

  <rect x="880" y="328" width="270" height="52" rx="7" class="panel2"/>
  <circle cx="896" cy="346" r="4" class="green"/>
  <text x="908" y="350" class="t">渠道 B · 备用</text>
  <text x="908" y="367" class="tiny">延迟 720ms · 成功率 98.9%</text>
  <text x="1128" y="350" class="tiny" fill="#34d399">在线</text>

  <rect x="880" y="388" width="270" height="52" rx="7" class="panel2"/>
  <circle cx="896" cy="406" r="4" class="amber"/>
  <text x="908" y="410" class="t">渠道 C · 限流中</text>
  <text x="908" y="427" class="tiny">延迟 2.1s · 成功率 92.1%</text>
  <text x="1128" y="410" class="tiny" fill="#fbbf24">降级</text>

  <!-- logs -->
  <rect x="230" y="496" width="940" height="196" class="panel" rx="10"/>
  <text x="250" y="524" class="h2">最近请求</text>
  <text x="1080" y="524" class="tiny">仅展示 4 条 · 示例数据</text>
  <line x1="250" y1="538" x2="1150" y2="538" class="grid"/>
  <text x="250" y="558" class="tiny">时间</text>
  <text x="360" y="558" class="tiny">用户</text>
  <text x="480" y="558" class="tiny">模型</text>
  <text x="660" y="558" class="tiny">状态</text>
  <text x="760" y="558" class="tiny">耗时</text>
  <text x="850" y="558" class="tiny">Token</text>
  <text x="960" y="558" class="tiny">渠道</text>
  <text x="1070" y="558" class="tiny">费用</text>

  <text x="250" y="586" class="s">14:32:08</text>
  <text x="360" y="586" class="s">user_***21</text>
  <text x="480" y="586" class="s">model-alpha</text>
  <text x="660" y="586" class="s" fill="#34d399">200</text>
  <text x="760" y="586" class="s">1.2s</text>
  <text x="850" y="586" class="s">1,240</text>
  <text x="960" y="586" class="s">A</text>
  <text x="1070" y="586" class="s">¥0.012</text>

  <text x="250" y="614" class="s">14:31:55</text>
  <text x="360" y="614" class="s">user_***08</text>
  <text x="480" y="614" class="s">model-beta</text>
  <text x="660" y="614" class="s" fill="#34d399">200</text>
  <text x="760" y="614" class="s">0.9s</text>
  <text x="850" y="614" class="s">860</text>
  <text x="960" y="614" class="s">B</text>
  <text x="1070" y="614" class="s">¥0.006</text>

  <text x="250" y="642" class="s">14:31:42</text>
  <text x="360" y="642" class="s">user_***55</text>
  <text x="480" y="642" class="s">model-alpha</text>
  <text x="660" y="642" class="s" fill="#fbbf24">429</text>
  <text x="760" y="642" class="s">0.3s</text>
  <text x="850" y="642" class="s">0</text>
  <text x="960" y="642" class="s">C</text>
  <text x="1070" y="642" class="s">¥0.000</text>

  <text x="250" y="670" class="s">14:31:30</text>
  <text x="360" y="670" class="s">user_***17</text>
  <text x="480" y="670" class="s">model-gamma</text>
  <text x="660" y="670" class="s" fill="#34d399">200</text>
  <text x="760" y="670" class="s">2.4s</text>
  <text x="850" y="670" class="s">2,910</text>
  <text x="960" y="670" class="s">A</text>
  <text x="1070" y="670" class="s">¥0.031</text>

  <text x="230" y="730" class="tiny" fill="#fbbf24">示意图（mockup）：布局与字段用于说明后台能看什么，数字、模型名、用户均为虚构示例，不是真实后台截图。</text>
</svg>