<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Lingqu relay deployment flow">
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .card { fill: #111c31; stroke: #334155; stroke-width: 1.4; }
      .num { fill: #38bdf8; font-family: Segoe UI, sans-serif; font-size: 24px; font-weight: 800; }
      .t { fill: #e2e8f0; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 13px; }
      .h { fill: #f8fafc; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 15px; font-weight: 700; }
      .s { fill: #94a3b8; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 12px; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="560"/>
  <text x="40" y="48" class="h" font-size="20">Deployment flow · 10 steps</text>
  <text x="40" y="72" class="s">Do not skip DNS and port checks. Most certificate failures are DNS/80 problems, not Caddy bugs.</text>

  <!-- row 1 -->
  <rect x="40" y="105" width="270" height="120" class="card" rx="10"/>
  <text x="60" y="145" class="num">01</text>
  <text x="100" y="142" class="h">DNS</text>
  <text x="60" y="172" class="s">A @ and www -&gt; server IP</text>
  <text x="60" y="194" class="s">dig +short, wait for TTL</text>

  <rect x="365" y="105" width="270" height="120" class="card" rx="10"/>
  <text x="385" y="145" class="num">02</text>
  <text x="425" y="142" class="h">Dependencies</text>
  <text x="385" y="172" class="s">docker / compose / caddy</text>
  <text x="385" y="194" class="s">sqlite3 / python3 / curl</text>

  <rect x="690" y="105" width="270" height="120" class="card" rx="10"/>
  <text x="710" y="145" class="num">03</text>
  <text x="750" y="142" class="h">new-api</text>
  <text x="710" y="172" class="s">127.0.0.1:3000</text>
  <text x="710" y="194" class="s">/api/status -&gt; 200</text>

  <!-- row 2 -->
  <rect x="690" y="270" width="270" height="120" class="card" rx="10"/>
  <text x="710" y="310" class="num">04</text>
  <text x="750" y="307" class="h">Caddy + TLS</text>
  <text x="710" y="337" class="s">validate -&gt; reload</text>
  <text x="710" y="359" class="s">https 200 / cert issued</text>

  <rect x="365" y="270" width="270" height="120" class="card" rx="10"/>
  <text x="385" y="310" class="num">05</text>
  <text x="425" y="307" class="h">Admin</text>
  <text x="385" y="337" class="s">create admin</text>
  <text x="385" y="359" class="s">strong password, close signup</text>

  <rect x="40" y="270" width="270" height="120" class="card" rx="10"/>
  <text x="60" y="310" class="num">06</text>
  <text x="100" y="307" class="h">Channels</text>
  <text x="60" y="337" class="s">base_url / key / models</text>
  <text x="60" y="359" class="s">test + probe-models.py</text>

  <!-- row 3 -->
  <rect x="40" y="435" width="270" height="100" class="card" rx="10"/>
  <text x="60" y="475" class="num">07</text>
  <text x="100" y="472" class="h">Pricing</text>
  <text x="60" y="500" class="s">quota / ratio / min topup</text>
  <text x="60" y="520" class="s">small test, then payment</text>

  <rect x="365" y="435" width="270" height="100" class="card" rx="10"/>
  <text x="385" y="475" class="num">08</text>
  <text x="425" y="472" class="h">Captcha gate</text>
  <text x="385" y="500" class="s">127.0.0.1:3100</text>
  <text x="385" y="520" class="s">/lq/captcha + /api/user/register</text>

  <rect x="690" y="435" width="270" height="100" class="card" rx="10"/>
  <text x="710" y="475" class="num">09</text>
  <text x="750" y="472" class="h">cron + backup</text>
  <text x="710" y="500" class="s">backup.sh / health-check.sh</text>
  <text x="710" y="520" class="s">offsite copy</text>

  <!-- arrows -->
  <path class="arrow" d="M 310 165 L 360 165"/>
  <path class="arrow" d="M 635 165 L 685 165"/>
  <path class="arrow" d="M 825 225 L 825 265"/>
  <path class="arrow" d="M 690 330 L 640 330"/>
  <path class="arrow" d="M 365 330 L 315 330"/>
  <path class="arrow" d="M 310 330 L 310 430"/>
  <path class="arrow" d="M 365 485 L 360 485"/>
  <path class="arrow" d="M 635 485 L 685 485"/>

  <text x="40" y="410" class="s" font-style="italic">Step 10: acceptance</text>
  <text x="365" y="410" class="s" font-style="italic">-&gt; health-check, /v1/models, register, backup, small topup</text>
</svg>