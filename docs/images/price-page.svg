<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-label="Relay public price page mockup">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.2"/>
    </linearGradient>
    <style>
      .bg { fill: #f5f7fb; }
      .white { fill: #ffffff; }
      .title { fill: #0f172a; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 18px; font-weight: 700; }
      .h1 { fill: #f8fafc; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 34px; font-weight: 800; }
      .h2 { fill: #0f172a; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 14px; font-weight: 700; }
      .h3 { fill: #f8fafc; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 16px; font-weight: 700; }
      .t { fill: #334155; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 12px; }
      .s { fill: #64748b; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 10px; }
      .tiny { fill: #94a3b8; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 9px; }
      .light { fill: #e2e8f0; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 12px; }
      .lights { fill: #cbd5e1; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 10px; }
      .price { fill: #0f172a; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 28px; font-weight: 800; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .card-hi { fill: #ffffff; stroke: #2563eb; stroke-width: 2; }
      .accent { fill: #2563eb; }
      .badge { fill: #dbeafe; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1100" height="780"/>

  <!-- nav -->
  <rect class="white" width="1100" height="72"/>
  <circle cx="42" cy="36" r="10" fill="#2563eb"/>
  <text x="60" y="42" class="title">灵渠 AI</text>
  <text x="190" y="42" class="t">首页</text>
  <text x="250" y="42" class="t" fill="#2563eb" font-weight="700">价格</text>
  <text x="310" y="42" class="t">文档</text>
  <text x="370" y="42" class="t">模型</text>
  <rect x="900" y="20" width="72" height="32" rx="6" fill="#f1f5f9"/>
  <text x="918" y="40" class="t">登录</text>
  <rect x="984" y="20" width="86" height="32" rx="6" fill="#2563eb"/>
  <text x="1004" y="40" class="t" fill="#ffffff" font-weight="700">免费注册</text>

  <!-- hero -->
  <rect x="0" y="72" width="1100" height="286" fill="url(#hero)"/>
  <circle cx="930" cy="160" r="130" fill="url(#glow)" opacity="0.22"/>
  <circle cx="1020" cy="300" r="90" fill="#22d3ee" opacity="0.12"/>
  <text x="56" y="146" class="h1">一个入口，调用多家模型</text>
  <text x="56" y="180" class="light">OpenAI 兼容 · 多渠道自动切换 · 按量计费 · 余额透明</text>
  <text x="56" y="204" class="lights">把 base_url 换成你的域名，已有 SDK 和工具通常不用改代码。</text>
  <rect x="56" y="232" width="150" height="40" rx="8" fill="#22d3ee"/>
  <text x="88" y="257" class="t" fill="#082f49" font-weight="700">查看价格</text>
  <rect x="218" y="232" width="150" height="40" rx="8" fill="none" stroke="#94a3b8"/>
  <text x="252" y="257" class="light" font-weight="700">阅读文档</text>

  <!-- code card -->
  <rect x="750" y="112" width="290" height="204" rx="12" fill="#020617" stroke="#334155"/>
  <text x="770" y="138" class="tiny" fill="#94a3b8">OPENAI_BASE_URL</text>
  <text x="770" y="160" class="lights" fill="#67e8f9">https://www.YOUR_DOMAIN/v1</text>
  <line x1="770" y1="176" x2="1020" y2="176" stroke="#1e293b"/>
  <text x="770" y="198" class="tiny" fill="#94a3b8">API_KEY</text>
  <text x="770" y="220" class="lights" fill="#fbbf24">sk-********************</text>
  <line x1="770" y1="236" x2="1020" y2="236" stroke="#1e293b"/>
  <text x="770" y="258" class="tiny" fill="#94a3b8">MODEL</text>
  <text x="770" y="280" class="lights" fill="#a7f3d0">model-alpha</text>

  <!-- price cards -->
  <text x="56" y="404" class="h2">按量计费，用多少付多少</text>
  <text x="56" y="424" class="s">以下为示例价格，部署后请在后台按上游成本自行设置。</text>

  <rect x="56" y="444" width="310" height="180" class="card" rx="12"/>
  <text x="78" y="474" class="h2">轻量档</text>
  <text x="78" y="494" class="s">适合聊天、摘要、翻译</text>
  <text x="78" y="536" class="price">¥2</text>
  <text x="118" y="536" class="s">/ 1M 输入 token</text>
  <text x="78" y="560" class="t">输出 ¥8 / 1M token</text>
  <line x1="78" y1="578" x2="344" y2="578" class="grid"/>
  <text x="78" y="600" class="s">模型：model-alpha</text>

  <rect x="394" y="444" width="310" height="180" class="card-hi" rx="12"/>
  <rect x="394" y="444" width="310" height="28" rx="12" fill="#2563eb"/>
  <text x="506" y="463" class="tiny" fill="#ffffff">最常用</text>
  <text x="416" y="498" class="h2">标准档</text>
  <text x="416" y="518" class="s">适合代码、长文、复杂问答</text>
  <text x="416" y="560" class="price">¥6</text>
  <text x="456" y="560" class="s">/ 1M 输入 token</text>
  <text x="416" y="584" class="t">输出 ¥24 / 1M token</text>
  <line x1="416" y1="602" x2="682" y2="602" class="grid"/>
  <text x="416" y="620" class="s">模型：model-beta</text>

  <rect x="732" y="444" width="310" height="180" class="card" rx="12"/>
  <text x="754" y="474" class="h2">高质档</text>
  <text x="754" y="494" class="s">适合高难推理、正式产出</text>
  <text x="754" y="536" class="price">¥18</text>
  <text x="800" y="536" class="s">/ 1M 输入 token</text>
  <text x="754" y="560" class="t">输出 ¥72 / 1M token</text>
  <line x1="754" y1="578" x2="1020" y2="578" class="grid"/>
  <text x="754" y="600" class="s">模型：model-gamma</text>

  <!-- model table -->
  <rect x="56" y="654" width="986" height="82" class="white" rx="10" stroke="#e2e8f0"/>
  <text x="78" y="682" class="h2">模型与倍率</text>
  <text x="960" y="682" class="tiny">示例页面 · 非真实报价</text>
  <text x="78" y="710" class="s">model-alpha</text>
  <text x="300" y="710" class="s">输入 ¥2 · 输出 ¥8</text>
  <text x="560" y="710" class="s">1.0×</text>
  <text x="760" y="710" class="s">model-beta</text>
  <text x="900" y="710" class="s">1.4×</text>

  <text x="56" y="764" class="tiny">示意图（mockup）：价格、模型名、域名均为占位示例，不代表任何真实服务或报价。</text>
</svg>